name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 수동 실행 가능

env:
  DOCKER_IMAGE: gilhwanjeon/smwr_front-nextjs-app
  DOCKER_TAG: latest
  YARN_CACHE_FOLDER: .yarn/cache
  YARN_VIRTUAL_FOLDER: .yarn/__virtual__
  YARN_PNP_UNPLUGGED_FOLDER: .yarn/unplugged

jobs:
  build-and-push:
    # k3s 노드가 ARM64(Graviton/t4g 등)면 이미지도 linux/arm64 — 네이티브 러너로 QEMU 없이 빌드
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate

      - name: Cache Yarn Berry artifacts
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/__virtual__
            .yarn/unplugged
            .yarn/install-state.gz
            .pnp.cjs
            .pnp.loader.mjs
          key: ${{ runner.os }}-yarn-berry-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn-berry-

      - name: Install dependencies
        run: yarn install --immutable

      # next-env.d.ts / tsc가 참조하는 `.next/types/routes.d.ts`는 `next build`로 생성됨
      - name: Build Next.js app
        run: yarn build
        env:
          NODE_ENV: production

      - name: Type check
        run: yarn type-check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Open EC2 port 22 for this runner
        id: open-sg
        run: |
          RUNNER_IP=$(curl -sf https://checkip.amazonaws.com)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr "${RUNNER_IP}/32" \
            --tag-specifications "ResourceType=security-group-rule,Tags=[{Key=Purpose,Value=github-actions-temp}]"
          echo "Port 22 opened for ${RUNNER_IP}"

      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            DEPLOY_NAME="smwr-front"
            KUBECTL="sudo k3s kubectl"
            REPO_URL="https://github.com/jgh9514/SMWR_FRONT.git"
            REPO_BRANCH="${{ github.ref_name }}"
            WORK_DIR="/tmp/smwr-front-deploy"

            echo "=== ~/SMWR_FRONT 최신 코드 동기화 (WAS와 동일하게 자동 pull) ==="
            if [ ! -d ~/SMWR_FRONT/.git ]; then
              echo "~/SMWR_FRONT 없음, 초기 clone"
              rm -rf ~/SMWR_FRONT
              git clone --depth 1 --branch "${REPO_BRANCH}" "${REPO_URL}" ~/SMWR_FRONT || echo "WARNING: clone 실패 (무시)"
            fi
            if [ -d ~/SMWR_FRONT/.git ]; then
              cd ~/SMWR_FRONT || true
              GIT_FETCH_OK=false
              for i in 1 2 3 4 5; do
                if git fetch origin "${REPO_BRANCH}" 2>&1; then
                  GIT_FETCH_OK=true
                  break
                fi
                echo "fetch 재시도 $i/5..."
                sleep 5
              done
              if [ "$GIT_FETCH_OK" = "true" ] && git rev-parse --verify "origin/${REPO_BRANCH}" >/dev/null 2>&1; then
                git reset --hard "origin/${REPO_BRANCH}" 2>&1 || git checkout -B "${REPO_BRANCH}" "origin/${REPO_BRANCH}" 2>&1
                echo "~/SMWR_FRONT 동기화 완료: $(git log -1 --oneline 2>/dev/null || echo '?')"
              else
                echo "WARNING: ~/SMWR_FRONT fetch 실패, 기존 코드 유지"
              fi
              cd - >/dev/null 2>&1 || true
            fi

            echo "=== 배포 작업 디렉토리 준비 ==="
            rm -rf "${WORK_DIR}"
            git clone --depth 1 --branch "${REPO_BRANCH}" "${REPO_URL}" "${WORK_DIR}" || {
              echo "ERROR: 프론트 레포 clone 실패"
              exit 1
            }
            cd "${WORK_DIR}" || {
              echo "ERROR: 작업 디렉토리 이동 실패"
              exit 1
            }

            if [ ! -f k8s/deployment.yaml ]; then
              echo "ERROR: clone한 레포에 k8s/deployment.yaml 이 없습니다."
              exit 1
            fi

            echo "=== kubectl 클러스터 정보 확인 ==="
            ${KUBECTL} cluster-info --request-timeout=20s || {
              echo "ERROR: kubectl cluster-info 실패"
              exit 1
            }

            echo "=== 현재 deployment 확인 ==="
            ${KUBECTL} get deployment "${DEPLOY_NAME}" --request-timeout=15s || true
            ${KUBECTL} get deployments --request-timeout=15s || true

            echo "=== k8s 매니페스트 적용 ==="
            if [ -f k8s/configmap.yaml ]; then
              ${KUBECTL} apply -f k8s/configmap.yaml --request-timeout=180s || {
                echo "ERROR: k8s/configmap.yaml 적용 실패"
                exit 1
              }
            fi

            if [ -f k8s/service.yaml ]; then
              ${KUBECTL} apply -f k8s/service.yaml --request-timeout=180s || {
                echo "ERROR: k8s/service.yaml 적용 실패"
                exit 1
              }
            fi

            # Deployment apply는 strategic-merge 패치로 API 서버 부하·etcd 지연 시 Timeout 날 수 있음 (특히 단일노드 k3s)
            apply_deployment() {
              ${KUBECTL} apply -f k8s/deployment.yaml --request-timeout=300s
            }
            DEPLOY_APPLY_OK=false
            for attempt in 1 2 3; do
              if apply_deployment; then
                DEPLOY_APPLY_OK=true
                break
              fi
              echo "WARNING: k8s/deployment.yaml apply 실패 (${attempt}/3). 20초 대기 후 재시도..."
              ${KUBECTL} get deployment "${DEPLOY_NAME}" -o wide --request-timeout=30s 2>/dev/null || true
              sleep 20
            done
            if [ "$DEPLOY_APPLY_OK" != "true" ]; then
              echo "ERROR: k8s/deployment.yaml 적용 실패 (3회). EC2에서: sudo k3s kubectl get pods -A; journalctl -u k3s -n 80"
              exit 1
            fi

            if [ -f k8s/ingress.yaml ]; then
              ${KUBECTL} apply -f k8s/ingress.yaml --request-timeout=180s || {
                echo "WARNING: k8s/ingress.yaml 적용 실패"
              }
            fi

            echo "=== 새 이미지를 확실히 가져오도록 deployment 재시작 ==="
            ${KUBECTL} rollout restart deployment "${DEPLOY_NAME}" --request-timeout=180s || {
              echo "ERROR: deployment ${DEPLOY_NAME} 재시작 실패"
              exit 1
            }

            echo "=== 배포 상태 모니터링 ==="
            ${KUBECTL} rollout status deployment "${DEPLOY_NAME}" --timeout=5m || {
              echo "ERROR: deployment ${DEPLOY_NAME} rollout 실패"
              ${KUBECTL} get pods -l app="${DEPLOY_NAME}" --request-timeout=30s || true
              exit 1
            }

      - name: Close EC2 port 22 (cleanup)
        if: always() && steps.open-sg.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr "${{ steps.open-sg.outputs.runner_ip }}/32" || true
          echo "Port 22 closed for ${{ steps.open-sg.outputs.runner_ip }}"
