name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 수동 실행 가능

env:
  DOCKER_IMAGE: gilhwanjeon/smwr_front-nextjs-app
  DOCKER_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build Next.js app
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            export KUBECONFIG=~/.kube/config
            DEPLOY_NAME="smwr-front"

            echo "=== kubectl 클러스터 정보 확인 ==="
            kubectl cluster-info --request-timeout=10s || {
              echo "ERROR: kubectl cluster-info 실패"
              exit 1
            }

            echo "=== 현재 deployment 확인 ==="
            kubectl get deployment "${DEPLOY_NAME}" --request-timeout=15s || true
            kubectl get deployments --request-timeout=15s || true

            if ! kubectl get deployment "${DEPLOY_NAME}" --request-timeout=15s >/dev/null 2>&1; then
              echo "Deployment ${DEPLOY_NAME} 가 없어 k8s 매니페스트 적용을 시도합니다."

              if [ -f k8s/configmap.yaml ]; then
                kubectl apply -f k8s/configmap.yaml --request-timeout=60s || {
                  echo "ERROR: k8s/configmap.yaml 적용 실패"
                  exit 1
                }
              fi

              if [ -f k8s/service.yaml ]; then
                kubectl apply -f k8s/service.yaml --request-timeout=60s || {
                  echo "ERROR: k8s/service.yaml 적용 실패"
                  exit 1
                }
              fi

              if [ -f k8s/deployment.yaml ]; then
                kubectl apply -f k8s/deployment.yaml --request-timeout=60s || {
                  echo "ERROR: k8s/deployment.yaml 적용 실패"
                  exit 1
                }
              else
                echo "ERROR: ${DEPLOY_NAME} deployment가 없고, 원격 서버에 k8s/deployment.yaml도 없습니다."
                exit 1
              fi

              if [ -f k8s/ingress.yaml ]; then
                kubectl apply -f k8s/ingress.yaml --request-timeout=60s || {
                  echo "WARNING: k8s/ingress.yaml 적용 실패"
                }
              fi
            fi

            echo "=== 새 이미지를 확실히 가져오도록 deployment 재시작 ==="
            kubectl rollout restart deployment "${DEPLOY_NAME}" --request-timeout=60s || {
              echo "ERROR: deployment ${DEPLOY_NAME} 재시작 실패"
              exit 1
            }

            echo "=== 배포 상태 모니터링 ==="
            kubectl rollout status deployment "${DEPLOY_NAME}" --timeout=5m || {
              echo "ERROR: deployment ${DEPLOY_NAME} rollout 실패"
              kubectl get pods -l app="${DEPLOY_NAME}" --request-timeout=30s || true
              exit 1
            }

