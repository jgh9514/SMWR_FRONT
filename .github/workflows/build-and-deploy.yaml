name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 수동 실행 가능

env:
  DOCKER_IMAGE: gilhwanjeon/smwr_front-nextjs-app
  DOCKER_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn type-check

      - name: Build Next.js app
        run: yarn build
        env:
          NODE_ENV: production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            DEPLOY_NAME="smwr-front"
            KUBECTL="sudo k3s kubectl"
            REPO_URL="https://github.com/jgh9514/SMWR_FRONT.git"
            REPO_BRANCH="${{ github.ref_name }}"
            WORK_DIR="/tmp/smwr-front-deploy"

            echo "=== 배포 작업 디렉토리 준비 ==="
            rm -rf "${WORK_DIR}"
            git clone --depth 1 --branch "${REPO_BRANCH}" "${REPO_URL}" "${WORK_DIR}" || {
              echo "ERROR: 프론트 레포 clone 실패"
              exit 1
            }
            cd "${WORK_DIR}" || {
              echo "ERROR: 작업 디렉토리 이동 실패"
              exit 1
            }

            if [ ! -f k8s/deployment.yaml ]; then
              echo "ERROR: clone한 레포에 k8s/deployment.yaml 이 없습니다."
              exit 1
            fi

            echo "=== kubectl 클러스터 정보 확인 ==="
            ${KUBECTL} cluster-info --request-timeout=20s || {
              echo "ERROR: kubectl cluster-info 실패"
              exit 1
            }

            echo "=== 현재 deployment 확인 ==="
            ${KUBECTL} get deployment "${DEPLOY_NAME}" --request-timeout=15s || true
            ${KUBECTL} get deployments --request-timeout=15s || true

            echo "=== k8s 매니페스트 적용 ==="
            if [ -f k8s/configmap.yaml ]; then
              ${KUBECTL} apply -f k8s/configmap.yaml --request-timeout=180s || {
                echo "ERROR: k8s/configmap.yaml 적용 실패"
                exit 1
              }
            fi

            if [ -f k8s/service.yaml ]; then
              ${KUBECTL} apply -f k8s/service.yaml --request-timeout=180s || {
                echo "ERROR: k8s/service.yaml 적용 실패"
                exit 1
              }
            fi

            ${KUBECTL} apply -f k8s/deployment.yaml --request-timeout=180s || {
              echo "ERROR: k8s/deployment.yaml 적용 실패"
              exit 1
            }

            if [ -f k8s/ingress.yaml ]; then
              ${KUBECTL} apply -f k8s/ingress.yaml --request-timeout=180s || {
                echo "WARNING: k8s/ingress.yaml 적용 실패"
              }
            fi

            echo "=== 새 이미지를 확실히 가져오도록 deployment 재시작 ==="
            ${KUBECTL} rollout restart deployment "${DEPLOY_NAME}" --request-timeout=180s || {
              echo "ERROR: deployment ${DEPLOY_NAME} 재시작 실패"
              exit 1
            }

            echo "=== 배포 상태 모니터링 ==="
            ${KUBECTL} rollout status deployment "${DEPLOY_NAME}" --timeout=5m || {
              echo "ERROR: deployment ${DEPLOY_NAME} rollout 실패"
              ${KUBECTL} get pods -l app="${DEPLOY_NAME}" --request-timeout=30s || true
              exit 1
            }

