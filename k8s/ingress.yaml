apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smwr-front-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # API와 이미지 경로는 백엔드로 직접 프록시 (rewrite 없음)
    # HTTPS 사용 시 주석 해제
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # TLS 설정 (HTTPS 사용 시 주석 해제)
  # tls:
  # - hosts:
  #   - your-domain.com
  #   secretName: smwr-front-tls
  rules:
  - host: your-domain.com  # 실제 도메인으로 변경 필요
    http:
      paths:
      # API 요청을 백엔드로 프록시 (/api/v1/* -> smw-app-service:8080/api/v1/*)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: smw-app-service
            port:
              number: 8080
      # 이미지 요청을 백엔드로 프록시 (/images/* -> smw-app-service:8080/images/*)
      - path: /images
        pathType: Prefix
        backend:
          service:
            name: smw-app-service
            port:
              number: 8080
      # 나머지 요청은 프론트엔드로
      - path: /
        pathType: Prefix
        backend:
          service:
            name: smwr-front-service
            port:
              number: 80

