apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smwr-front-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik  # k3s 기본 Traefik (80번 포트 사용)
  tls:
  - hosts:
    - jgh9514.com
    - www.jgh9514.com
    secretName: jgh9514-tls
  rules:
  - host: jgh9514.com
    http:
      paths:
      # API 요청을 백엔드로 프록시 (/api/v1/* -> smw-app-service:8080/api/v1/*)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: smw-app-service
            port:
              number: 8080
      # 이미지 요청을 백엔드로 프록시 (/images/* -> smw-app-service:8080/images/*)
      - path: /images
        pathType: Prefix
        backend:
          service:
            name: smw-app-service
            port:
              number: 8080
      # 나머지 요청은 프론트엔드로
      - path: /
        pathType: Prefix
        backend:
          service:
            name: smwr-front-service
            port:
              number: 80
  - host: www.jgh9514.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: smw-app-service
            port:
              number: 8080
      - path: /images
        pathType: Prefix
        backend:
          service:
            name: smw-app-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: smwr-front-service
            port:
              number: 80
