apiVersion: apps/v1
kind: Deployment
metadata:
  name: smwr-front
  labels:
    app: smwr-front
    environment: production
spec:
  replicas: 1  # 프론트엔드는 1개로도 충분 (필요시 2개로 증가 가능)
  selector:
    matchLabels:
      app: smwr-front
  template:
    metadata:
      labels:
        app: smwr-front
    spec:
      containers:
      - name: smwr-front
        image: gilhwanjeon/smwr_front-nextjs-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        # t4g.medium: Node 힙 상한 256MB (컨테이너 limit 384Mi)
        - name: NODE_OPTIONS
          value: "--max-old-space-size=256"
        # 백엔드 API URL 설정 (쿠버네티스 클러스터 내부 Service 이름 사용)
        - name: NEXT_PUBLIC_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: smwr-front-config
              key: api-base-url
              optional: true
        resources:
          requests:
            memory: "192Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

